<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosphere // Minimal Weather Tracker</title>
    <style>
        /* Modern dark mode styling designed for clean readability */
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent: #58a6ff;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #30363d;
        }
        h1 { font-size: 1.8rem; margin-top: 0; font-weight: 600; }
        .search-box { display: flex; gap: 10px; margin-bottom: 1.5rem; }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #21262d;
            color: white;
            font-size: 1rem;
        }
        input:focus { border-color: var(--accent); outline: none; }
        button {
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            background-color: var(--accent);
            color: #0d1117;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .result-card {
            border-top: 1px solid #30363d;
            padding-top: 1.5rem;
            margin-top: 1.5rem;
        }
        .temp { font-size: 3rem; font-weight: bold; margin: 0.5rem 0; color: white; }
        .status { color: var(--text-muted); text-transform: capitalize; }
    </style>
</head>
<body>

<div class="container">
    <h1>Atmosphere.</h1>
    <div class="search-box">
        <input type="text" id="cityInput" placeholder="Search global conditions...">
        <button onclick="fetchWeatherData()">Search</button>
    </div>
    <div id="displayArea"></div>
</div>

<script src="script.js"></script>
</body>
</html>
